# CourseHub 一键部署
#
# 两种用法（二选一）：
#   1) 在服务器上直接构建：  docker compose up -d --build
#   2) 拉取镜像仓库里的镜像：IMAGE=ghcr.io/你的用户名/course-hub:latest docker compose pull
#                            IMAGE=ghcr.io/你的用户名/course-hub:latest docker compose up -d
#
# 镜像除了 latest，每次构建都会带版本号标签（如 1.0.0-sha-6f179c0），
# 升级/回滚时把 IMAGE 换成具体版本即可，配合 `GET /healthz` 确认线上版本。
#
# 配置写在同目录的 .env 里（参考 .env.example），compose 会自动读取。

services:
  course-hub:
    build:
      context: .
      # 版本信息（可选）：留空则 Dockerfile 自动从 web/package.json + 构建时间生成，
      # 可通过 `echo "VERSION=1.0.0-sha-xxxx" >> .env` 固定成指定版本
      args:
        VERSION: ${VERSION:-}
        COMMIT: ${COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: ${IMAGE:-course-hub:latest}
    container_name: course-hub
    restart: unless-stopped
    # 用 tini 做 1 号进程，正确处理信号（优雅停机 / docker stop 不会被拖 10 秒）
    init: true
    stop_grace_period: 15s
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TZ: Asia/Shanghai
      # 管理员登录密码（首次启动创建 admin 时使用；留空则随机生成并打印在启动日志里）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 会话签名密钥（留空则自动生成并持久化到 /data/.jwt_secret；多实例部署必须显式指定同一个值）
      JWT_SECRET: ${JWT_SECRET:-}
      # 站点名称（首次启动写入数据库，之后以后台设置为准）
      SITE_NAME: ${SITE_NAME:-课程中心}
      # 注册模式（首次启动写入数据库，之后以后台设置为准）
      #   open=开放注册 | invite=需要机构邀请码 | closed=关闭注册
      REGISTER_MODE: ${REGISTER_MODE:-open}
      # 机构邀请码（REGISTER_MODE=invite 时生效，留空自动生成）
      ORG_INVITE_CODE: ${ORG_INVITE_CODE:-}
      # 兼容旧配置：REGISTER_MODE 未设置时，true 等价 open，false 等价 closed
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      # 全站 HTTPS 部署时设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 存储后端：local | s3 | webdav
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /data
      # S3 / MinIO 配置（STORAGE_TYPE=s3 时生效）
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      # WebDAV 配置（STORAGE_TYPE=webdav 时生效）
      WEBDAV_URL: ${WEBDAV_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      # 音视频通话 TURN 服务器（可选，公网部署建议配置）
      TURN_URL: ${TURN_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASS: ${TURN_PASS:-}
      # TURN 共享密钥（coturn use-auth-secret，推荐）：下发 2 小时临时账号，避免 TURN 被白嫖
      TURN_SECRET: ${TURN_SECRET:-}
      # 排障开关：前端白屏时可临时设 true 关闭 CSP
      CSP_DISABLE: ${CSP_DISABLE:-false}
      # 视频转码 / 播放（服务端 ffmpeg 切 HLS + AES-128 加密 + 有效期签名地址）
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      SIGN_TTL_MINUTES: ${SIGN_TTL_MINUTES:-120}
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-2}
      # 朗读（TTS）代理（可选）：配了之后前端 🔊 走 /api/tts，API key 只在服务端，不进前端
      TTS_URL: ${TTS_URL:-}
      TTS_KEY: ${TTS_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-en-US-AriaNeural}
      TTS_SPEED: ${TTS_SPEED:-0.9}
    volumes:
      # 数据库 + 上传的视频/聊天图片都放这里，备份目录即可
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 需要对象存储时可以一起启动 MinIO，然后把 STORAGE_TYPE 改成 s3：
