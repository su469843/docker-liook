name: Docker

# 推送到 main / 打 tag 时自动构建镜像并推送到 GitHub 容器仓库（GHCR）
# 镜像地址：ghcr.io/<你的GitHub用户名>/<仓库名>:latest
# 服务器上直接：docker pull ghcr.io/<用户名>/<仓库名>:latest

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建并推送镜像（amd64 + arm64）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 启用 QEMU（构建 arm64 镜像用）
        uses: docker/setup-qemu-action@v3

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入任务摘要
        run: |
          {
            echo "### 镜像已推送 ✅"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取：\`docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 想同时推到 Docker Hub / 阿里云 ACR 等仓库时，取消下面的注释并按需修改：
