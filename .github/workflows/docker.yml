name: Docker

# 推送到 main / 打 tag 时自动构建镜像并推送到 GitHub 容器仓库（GHCR）
# 镜像地址：ghcr.io/<你的GitHub用户名>/<仓库名>:latest
# 每次构建还会自动生成版本标签：<web/package.json 版本>-sha-<提交号>（见 scripts/version.sh），
# 服务器上可以拉指定版本，而不是只能用 latest：
#   docker pull ghcr.io/<用户名>/<仓库名>:1.0.0-sha-6f179c0

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建并推送镜像（amd64 + arm64）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 版本号 = web/package.json 的 version + 本次提交（详见 scripts/version.sh）
      # 这样每次构建出的镜像都有唯一版本标签，而不是只能拉 latest
      - name: 解析版本号（web/package.json + git 提交）
        id: version
        run: |
          echo "full=$(sh scripts/version.sh full)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sh scripts/version.sh tag)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sh scripts/version.sh commit)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 启用 QEMU（构建 arm64 镜像用）
        uses: docker/setup-qemu-action@v3

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.full }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写入任务摘要
        run: |
          {
            echo "### 镜像已推送 ✅"
            echo ""
            echo "版本：\`${{ steps.version.outputs.full }}\`（提交 \`${{ steps.version.outputs.commit }}\`）"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "固定到此版本：\`docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 想同时推到 Docker Hub / 阿里云 ACR 等仓库时，取消下面的注释并按需修改：
  #
  # push-other-registry:
  #   name: 推送到其它镜像仓库
  #   runs-on: ubuntu-latest
  #   needs: build
  #   steps:
  #     - uses: docker/login-action@v3
  #       with:
  #         registry: registry.cn-hangzhou.aliyuncs.com
  #         username: ${{ secrets.ACR_USERNAME }}
  #         password: ${{ secrets.ACR_PASSWORD }}
  #     - run: |
  #         docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest
  #         docker tag ${{ env.REGISTRY }}/${{ github.repository }}:latest registry.cn-hangzhou.aliyuncs.com/命名空间/course-hub:latest
  #         docker push registry.cn-hangzhou.aliyuncs.com/命名空间/course-hub:latest
