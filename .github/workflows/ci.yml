name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号统一由 scripts/version.sh 从 web/package.json + git 提交生成，
      # 这里先跑一遍，顺便在 CI 日志里打出本次构建版本
      - name: 解析版本号
        run: |
          echo "构建版本：$(sh scripts/version.sh full)"
          echo "镜像标签：$(sh scripts/version.sh tag)"

      # 前端产物会被 go:embed 打进二进制，必须先构建前端，
      # 否则 go vet / go test 会报 "pattern all:web/dist: no matching files found"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: web
        run: pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 代码格式检查
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w <文件>："
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: 编译检查（含前端嵌入）
        run: go build -trimpath -ldflags="-s -w" -o /tmp/course-hub .
